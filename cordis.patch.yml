# Backend API tools and an optional launcher for the web app's local Agent.
# API tools never require the browser or Agent. No stdio MCP bridge is needed.
- insert:
    - id: infinite-canvas
      name: dsh-infinite-canvas
      config:
        canvasBaseUrl: https://infic.transiglobal.com
        agentUrl: http://127.0.0.1:3210
        embedCredentials: true
        autoStart: true

    # Compatibility row for upgrades from v0.2: keep the old bridge disabled.
    - id: infinite-canvas-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: infinite-canvas
        transport: stdio
        command: npx
        args: ['-y', '@tigerowo/canvas-agent@latest', 'mcp']
        failOnStartupError: false
